name: Main

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
   

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.4.3
      with: 
      
        name: programa 
        path: ./projeto


  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit
  
